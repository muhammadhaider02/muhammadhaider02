name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write        # only the commit-back needs write; deny everything else
concurrency:
  group: readme-build    # overlapping runs can clobber the stats cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        run: |-
          # Allowlist, not "git add ." : this repo is public, so anything the build
          # happens to leave in the tree would be published. Never widen this, and
          # never add `git diff --cached` here -- it would print staged content to
          # the world-readable log.
          git add -- dark_mode.svg light_mode.svg 'cache/*.txt'
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "README-Bot"
          git commit -m "docs: update README stats" -m "Co-authored-by: Haider Akbar <muhammadhaiderakbar@gmail.com>" || echo "No changes to commit"
          git push
