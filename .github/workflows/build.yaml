name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write        # only the commit-back needs write; deny everything else
concurrency:
  group: readme-build    # overlapping runs can clobber the stats cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install --require-hashes -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
          CACHE_REPO: muhammadhaider02/readme-stats-cache  # private; holds the per-repo ledger
        run: python today.py
      - name: Commit
        # always() so the daily commit lands even when the stats step fails. Every strict
        # check runs before the SVGs are touched, so a failed run commits the previous
        # values rather than a half-written card.
        if: always()
        run: |-
          # Allowlist, not "git add ." : this repo is public, so anything the build
          # happens to leave in the tree would be published. Never widen this, and
          # never add `git diff --cached` here -- it would print staged content to
          # the world-readable log.
          git add -- dark_mode.svg light_mode.svg
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "README-Bot"
          # --allow-empty so the daily run always lands a commit. The card used to carry a
          # value that changed every single day, which meant there was always a diff to
          # commit; without it, a day with no new commits, stars or followers would produce
          # no commit at all and break the daily cadence.
          git commit --allow-empty -m "docs: update README stats" -m "Co-authored-by: Haider Akbar <muhammadhaiderakbar@gmail.com>"
          git push
